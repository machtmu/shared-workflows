name: kicad-export

on:
  workflow_call:
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Run all steps directly inside the KiCad container
    container:
      image: kicad/kicad:nightly-full
      options: --platform=linux/amd64

    steps:
      # 1) GitHub App token
      - id: create_app_token
        uses: tibdex/github-app-token@v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      # 2) Check out repository (no saved credentials)
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 3) Install SVG→PNG tool (small + fast)
      - name: Install SVG to PNG converter
        run: |
          apt-get update
          apt-get install -y --no-install-recommends librsvg2-bin
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      # 4) Run KiCad CLI exports
      - name: Export KiCad images and STEP
        run: |
          set -e

          export KICAD8_3DMODEL_DIR=/usr/share/kicad/3dmodels/
          export KICAD9_3DMODEL_DIR=/usr/share/kicad/3dmodels/

          mkdir -p images

          BOARD_FILE="kicad/recovery.kicad_pcb"
          SCH_FILE="kicad/recovery.kicad_sch"

          echo "Rendering 3D board (front)..."
          kicad-cli pcb render \
            --output images/board-front.png \
            --width 1600 --height 900 \
            --quality high \
            --floor \
            "$BOARD_FILE"

          echo "Rendering 3D board (back)..."
          kicad-cli pcb render \
            --output images/board-back.png \
            --side bottom \
            --width 1600 --height 900 \
            --quality high \
            --floor \
            "$BOARD_FILE"

          echo "Exporting schematic PNG..."
          kicad-cli sch export png \
            --output images/schematic.png \
            "$SCH_FILE"

          echo "Exporting footprints SVG..."
          kicad-cli pcb export svg \
            --output images/footprints.svg \
            "$BOARD_FILE"

          echo "Converting footprints SVG to PNG..."
          rsvg-convert images/footprints.svg -o images/footprints.png

          echo "Exporting STEP model..."
          kicad-cli pcb export step \
            --output images/board.step \
            "$BOARD_FILE"

      # 5) Configure Git
      - name: Configure Git
        run: |
          git config user.name "KiCad Export App"
          git config user.email "123456+MyKiCadApp[bot]@users.noreply.github.com"

      # 6) Commit and push changes using the App token
      - name: Commit changes using the App token
        run: |
          git add images/*
          git commit -m "Update KiCad images and STEP" || echo "No changes to commit."
          git remote set-url origin "https://x-access-token:${{ steps.create_app_token.outputs.token }}@github.com/${{ github.repository }}.git"
          git push origin main

      # 7) Notify completion
      - name: Notify completion
        run: echo "Updated images and pushed changes to the repository."
